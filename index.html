<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Light | Simulador de Iluminación</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: 'Inter', sans-serif; background: #0a0a0a; }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* Panel de control derecho */
        .ui-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            bottom: 20px;
            width: 280px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            overflow-y: auto;
            z-index: 100;
            font-size: 12px;
        }
        
        .ui-panel::-webkit-scrollbar { width: 4px; }
        .ui-panel::-webkit-scrollbar-track { background: #222; border-radius: 10px; }
        .ui-panel::-webkit-scrollbar-thumb { background: #fff; border-radius: 10px; }
        
        .section {
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }
        
        .section-title {
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        
        .preset-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .preset-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #eee;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
        }
        
        .preset-btn.active {
            background: #fff;
            color: #000;
        }
        
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            background: #111;
            padding: 8px 12px;
            border-radius: 30px;
        }
        
        .control-row label { color: #aaa; font-size: 10px; }
        input[type="range"] { width: 120px; }
        input[type="color"] { width: 32px; height: 28px; border-radius: 20px; }
        
        .joy-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        
        .joy-row { display: flex; gap: 12px; justify-content: center; }
        .joy-btn {
            background: #1e1e1e;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            border: 1px solid #444;
            color: #fff;
        }
        .joy-btn:active { background: #fff; color: #000; }
        
        .status-msg {
            background: #1a1a1a;
            padding: 8px;
            border-radius: 10px;
            font-size: 10px;
            text-align: center;
            margin-top: 10px;
            color: #ffaa66;
        }
        
        .reset-btn {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .preview-window {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 280px;
            background: rgba(0,0,0,0.85);
            border-radius: 16px;
            border: 1px solid #333;
            overflow: hidden;
            z-index: 100;
        }
        
        .preview-header {
            background: #111;
            padding: 8px 12px;
            font-size: 10px;
            font-weight: bold;
        }
        
        .preview-canvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }
        
        @media (max-width: 700px) {
            .ui-panel { width: 250px; padding: 12px; }
            .preview-window { width: 220px; }
            .joy-btn { width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div class="section">
            <div class="section-title">🎥 ENCUADRES</div>
            <div class="preset-grid" id="framingGrid">
                <button class="preset-btn" data-frame="general">General</button>
                <button class="preset-btn" data-frame="americano">Americano</button>
                <button class="preset-btn" data-frame="medio">Medio</button>
                <button class="preset-btn" data-frame="primero">Primer Plano</button>
                <button class="preset-btn" data-frame="detalle">Detalle</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">💡 ILUMINACIÓN</div>
            <div class="preset-grid" id="lightGrid">
                <button class="preset-btn" data-light="frontal">Frontal</button>
                <button class="preset-btn" data-light="lateral">Lateral</button>
                <button class="preset-btn" data-light="contraluz">Contraluz</button>
                <button class="preset-btn" data-light="rembrandt">Rembrandt</button>
                <button class="preset-btn" data-light="butterfly">Butterfly</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">🎮 LUZ MANUAL</div>
            <div class="joy-buttons">
                <div class="joy-row"><button class="joy-btn" data-axis="y" data-dir="up">▲</button></div>
                <div class="joy-row">
                    <button class="joy-btn" data-axis="x" data-dir="left">◀</button>
                    <button class="joy-btn" data-axis="y" data-dir="down">▼</button>
                    <button class="joy-btn" data-axis="x" data-dir="right">▶</button>
                </div>
                <div class="joy-row">
                    <button class="joy-btn" data-axis="z" data-dir="back">◀ Z</button>
                    <button class="joy-btn" data-axis="z" data-dir="forward">Z ▶</button>
                </div>
            </div>
            <div class="control-row"><label>Intensidad</label><input type="range" id="intensity" min="0" max="3" step="0.01" value="1.5"><span id="intensityVal">1.50</span></div>
            <div class="control-row"><label>Difusión</label><input type="range" id="diffusion" min="0" max="1.5" step="0.01" value="0.5"><span id="diffusionVal">0.50</span></div>
            <div class="control-row"><label>Color</label><input type="color" id="lightColor" value="#ffffff"></div>
        </div>
        
        <div class="section">
            <div class="section-title">🌙 LUZ RELLENO</div>
            <div class="control-row"><label>Intensidad</label><input type="range" id="fillInt" min="0" max="1.2" step="0.01" value="0.5"><span id="fillIntVal">0.50</span></div>
            <div class="control-row"><label>Color</label><input type="color" id="fillColor" value="#ccccdd"></div>
        </div>
        
        <button id="resetBtn" class="reset-btn">⟳ RESET</button>
        <div id="statusMsg" class="status-msg">🔄 Cargando modelo...</div>
    </div>
    
    <div class="preview-window">
        <div class="preview-header">📷 PREVISUALIZACIÓN</div>
        <canvas id="previewCanvas" class="preview-canvas"></canvas>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        
        // Configuración
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 1.6, 3.5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0.9, 0);
        
        // Suelo
        const grid = new THREE.GridHelper(6, 20, 0x333, 0x222);
        grid.position.y = -0.85;
        scene.add(grid);
        
        const ambient = new THREE.AmbientLight(0x222222, 0.5);
        scene.add(ambient);
        
        // Luz principal
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);
        
        // Esfera indicadora
        const indicator = new THREE.Mesh(
            new THREE.SphereGeometry(0.3, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffaa66, emissiveIntensity: 0.8 })
        );
        scene.add(indicator);
        
        // Luz de relleno
        const fillLight = new THREE.DirectionalLight(0xccccdd, 0.5);
        fillLight.position.set(1.5, 1.2, -1);
        scene.add(fillLight);
        
        // Variables de posición
        let lx = 2.2, ly = 2.2, lz = 1.8;
        
        function updateLight() {
            keyLight.position.set(lx, ly, lz);
            indicator.position.set(lx, ly, lz);
            document.getElementById('lightPosDisplay')?.remove();
        }
        
        // Cargar modelo GLB
        const statusDiv = document.getElementById('statusMsg');
        const modelUrl = './modelo.glb';
        
        const loader = new GLTFLoader();
        let modelLoaded = false;
        
        loader.load(modelUrl,
            (gltf) => {
                const model = gltf.scene;
                model.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                    }
                });
                model.scale.set(0.9, 0.9, 0.9);
                model.position.y = -0.5;
                scene.add(model);
                modelLoaded = true;
                statusDiv.innerHTML = '✅ Modelo cargado correctamente';
                statusDiv.style.color = '#aaffaa';
                setTimeout(() => {
                    statusDiv.style.opacity = '0.5';
                }, 3000);
            },
            (xhr) => {
                const percent = Math.floor((xhr.loaded / xhr.total) * 100);
                statusDiv.innerHTML = `📦 Cargando modelo... ${percent}%`;
            },
            (error) => {
                console.error('Error:', error);
                statusDiv.innerHTML = '❌ No se pudo cargar el modelo. Verifica que el archivo .glb esté en la raíz del repositorio.';
                statusDiv.style.color = '#ff8888';
                
                // Modelo de respaldo (cubo)
                const fallback = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 1.6, 0.5),
                    new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.4 })
                );
                fallback.position.y = 0;
                fallback.castShadow = true;
                scene.add(fallback);
            }
        );
        
        // Controles UI
        document.getElementById('intensity').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            keyLight.intensity = val;
            document.getElementById('intensityVal').innerText = val.toFixed(2);
            indicator.material.emissiveIntensity = 0.4 + val / 3;
        });
        
        document.getElementById('diffusion').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            const size = 1.5 + val * 3;
            keyLight.shadow.camera.left = -size;
            keyLight.shadow.camera.right = size;
            keyLight.shadow.camera.top = size;
            keyLight.shadow.camera.bottom = -size;
            keyLight.shadow.radius = val * 2;
            document.getElementById('diffusionVal').innerText = val.toFixed(2);
        });
        
        document.getElementById('lightColor').addEventListener('input', (e) => {
            keyLight.color.set(e.target.value);
        });
        
        document.getElementById('fillInt').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            fillLight.intensity = val;
            document.getElementById('fillIntVal').innerText = val.toFixed(2);
        });
        
        document.getElementById('fillColor').addEventListener('input', (e) => {
            fillLight.color.set(e.target.value);
        });
        
        // Presets de iluminación
        const lightPresets = {
            frontal: { x: 0, y: 1.6, z: 2.8 },
            lateral: { x: 2.8, y: 1.8, z: 0.5 },
            contraluz: { x: 0, y: 1.8, z: -2.6 },
            rembrandt: { x: 1.8, y: 2.0, z: 1.4 },
            butterfly: { x: 0, y: 2.8, z: 2.2 }
        };
        
        document.querySelectorAll('[data-light]').forEach(btn => {
            btn.addEventListener('click', () => {
                const preset = lightPresets[btn.dataset.light];
                if (preset) { lx = preset.x; ly = preset.y; lz = preset.z; updateLight(); }
                document.querySelectorAll('[data-light]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
        
        // Presets de encuadre
        const frames = {
            general: { pos: [3.5, 1.8, 4.2], target: [0, 0.8, 0] },
            americano: { pos: [2.8, 1.5, 3.2], target: [0, 0.9, 0] },
            medio: { pos: [2.2, 1.4, 2.5], target: [0, 1.0, 0] },
            primero: { pos: [1.6, 1.3, 1.8], target: [0, 1.1, 0] },
            detalle: { pos: [0.8, 0.9, 1.0], target: [0, 0.9, 0] }
        };
        
        document.querySelectorAll('[data-frame]').forEach(btn => {
            btn.addEventListener('click', () => {
                const f = frames[btn.dataset.frame];
                if (f) {
                    camera.position.set(f.pos[0], f.pos[1], f.pos[2]);
                    controls.target.set(f.target[0], f.target[1], f.target[2]);
                    controls.update();
                }
                document.querySelectorAll('[data-frame]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
        
        // Joystick
        document.querySelectorAll('.joy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const axis = btn.dataset.axis;
                const dir = btn.dataset.dir;
                const step = 0.25;
                if (axis === 'x') lx += dir === 'right' ? step : -step;
                if (axis === 'y') ly += dir === 'up' ? step : (dir === 'down' ? -step : 0);
                if (axis === 'z') lz += dir === 'forward' ? step : (dir === 'back' ? -step : 0);
                lx = Math.min(4.5, Math.max(-4.5, lx));
                ly = Math.min(4.5, Math.max(0.8, ly));
                lz = Math.min(4, Math.max(-3, lz));
                updateLight();
            });
        });
        
        // Reset
        document.getElementById('resetBtn').addEventListener('click', () => {
            lx = 2.2; ly = 2.2; lz = 1.8;
            updateLight();
            document.getElementById('intensity').value = "1.5";
            document.getElementById('diffusion').value = "0.5";
            document.getElementById('lightColor').value = "#ffffff";
            document.getElementById('fillInt').value = "0.5";
            document.getElementById('fillColor').value = "#ccccdd";
            keyLight.intensity = 1.5;
            keyLight.color.set('#ffffff');
            fillLight.intensity = 0.5;
            fillLight.color.set('#ccccdd');
            camera.position.set(3, 1.6, 3.5);
            controls.target.set(0, 0.9, 0);
            controls.update();
            document.querySelectorAll('[data-light], [data-frame]').forEach(b => b.classList.remove('active'));
        });
        
        // Preview (segunda cámara)
        const previewCanvas = document.getElementById('previewCanvas');
        const previewRenderer = new THREE.WebGLRenderer({ canvas: previewCanvas, alpha: false });
        previewRenderer.setSize(280, 158);
        const previewCamera = new THREE.PerspectiveCamera(45, 280/158, 0.1, 1000);
        
        function updatePreview() {
            previewCamera.position.copy(camera.position);
            previewCamera.quaternion.copy(camera.quaternion);
            previewRenderer.render(scene, previewCamera);
            requestAnimationFrame(updatePreview);
        }
        updatePreview();
        
        // Inicializar
        updateLight();
        keyLight.intensity = 1.5;
        fillLight.intensity = 0.5;
        
        // Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            indicator.scale.setScalar(0.95 + Math.sin(Date.now() * 0.005) * 0.05);
            renderer.render(scene, camera);
        }
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            previewRenderer.setSize(280, 158);
        });
    </script>
</body>
</html>
